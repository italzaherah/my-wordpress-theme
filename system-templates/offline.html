<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>لا يوجد اتصال — مركز الزاهرة للتدريب</title>
	<style>
		@font-face{font-family:"Alexandria";font-style:normal;font-weight:100 900;font-display:swap;src:url("../assets/fonts/alexandria-var-arabic.woff2") format("woff2")}
		@font-face{font-family:"Alexandria";font-style:normal;font-weight:100 900;font-display:swap;src:url("../assets/fonts/alexandria-var-latin.woff2") format("woff2")}
		:root{--alz-navy-900:#14213d;--alz-purple-600:#5b2ccb;--alz-line:#e7e9f1;--alz-surface:#fff;--alz-surface-subtle:#f7f8fc;--alz-radius-lg:24px;--alz-radius-sm:12px}
		*{box-sizing:border-box}
		body{margin:0;padding:24px;font-family:"Alexandria",Tahoma,Arial,sans-serif;font-size:16px;font-synthesis-weight:none;line-height:1.85;background:var(--alz-surface-subtle);color:var(--alz-navy-900);display:grid;min-height:100vh;place-items:center}
		.state{width:min(100%,42rem);padding:32px;text-align:center;background:var(--alz-surface);border:1px solid var(--alz-line);border-radius:var(--alz-radius-lg)}
		button{min-height:44px;padding:0 20px;border:0;border-radius:var(--alz-radius-sm);background:var(--alz-purple-600);color:var(--alz-surface);font:inherit;font-weight:700;cursor:pointer}
		button:focus-visible{outline:3px solid var(--alz-navy-900);outline-offset:3px}
	</style>
</head>
<body>
	<main class="state">
		<h1>لا يوجد اتصال بالإنترنت</h1>
		<p>تحقق من الشبكة، ثم حاول إعادة تحميل الصفحة. لم تُرسل أي بيانات أثناء انقطاع الاتصال.</p>
		<button type="button" onclick="location.reload()">إعادة المحاولة</button>
	</main>
</body>
</html>
