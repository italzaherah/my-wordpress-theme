name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND: theme
  PLUGIN_SLUG: alzaherah-platform-core
  THEME_SLUG: alzaherah-theme-v3
  # The other half of the plugin/theme pair, used for cross-version checks and the integrated smoke test.
  PAIRED_REPO: italzaherah/my-wordpress-plugin

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every PHP file
        run: |
          set +e
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l > "$RUNNER_TEMP/lint.txt" 2>&1
          status=$?
          grep -v '^No syntax errors detected' "$RUNNER_TEMP/lint.txt"
          echo "checked $(grep -c '^No syntax errors detected' "$RUNNER_TEMP/lint.txt") files"
          exit $status

  static:
    name: PHP 8.0+ compatibility, JS/CSS and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: self
      - name: Check out paired repository
        env:
          PAIRED_REPO_TOKEN: ${{ secrets.PAIRED_REPO_TOKEN }}
          PAIRED_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash self/.github/scripts/clone-paired.sh "$PAIRED_BRANCH" paired
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PHPCompatibility
        run: |
          mkdir -p "$RUNNER_TEMP/phpcs" && cd "$RUNNER_TEMP/phpcs"
          echo '{"config":{"allow-plugins":{"dealerdirect/phpcodesniffer-composer-installer":true}}}' > composer.json
          composer require --dev --no-interaction --no-progress \
            "squizlabs/php_codesniffer:^3.13" \
            "phpcompatibility/php-compatibility:^10.0@alpha" \
            "phpcompatibility/phpcompatibility-wp:^3.0@alpha" \
            "dealerdirect/phpcodesniffer-composer-installer:^1.0"
      - name: PHPCompatibility (PHP 8.0 and newer)
        working-directory: self
        run: |
          "$RUNNER_TEMP/phpcs/vendor/bin/phpcs" -p -s --standard=PHPCompatibilityWP \
            --runtime-set testVersion 8.0- --runtime-set ignore_warnings_on_exit 1 \
            --extensions=php --ignore=*/.git/* .
      - name: JavaScript syntax
        working-directory: self
        run: |
          status=0
          while IFS= read -r -d '' file; do
            node --check "$file" || status=1
          done < <(find . -name '*.js' -not -path './.git/*' -not -path '*/node_modules/*' -print0)
          exit $status
      - name: CSS and asset references
        run: python3 self/.github/scripts/check-assets.py self paired
      - name: Release metadata and version pairing
        run: php self/.github/scripts/check-versions.php self paired

  smoke:
    name: WordPress + WooCommerce smoke test
    runs-on: ubuntu-latest
    needs: [php-lint]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      WP_DIR: /tmp/wordpress
      BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
        with:
          path: self
      - name: Check out paired repository
        env:
          PAIRED_REPO_TOKEN: ${{ secrets.PAIRED_REPO_TOKEN }}
          PAIRED_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash self/.github/scripts/clone-paired.sh "$PAIRED_BRANCH" paired
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, gd, intl, mbstring
          coverage: none
          tools: wp-cli
      - name: Install WordPress and WooCommerce
        run: |
          wp core download --path="$WP_DIR" --allow-root
          wp config create --path="$WP_DIR" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root \
            --extra-php <<'PHP'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', '/tmp/wp-debug.log' );
          define( 'WP_DEBUG_DISPLAY', false );
          define( 'DISABLE_WP_CRON', true );
          PHP
          wp core install --path="$WP_DIR" --url="$BASE_URL" --title=CI --admin_user=admin --admin_password=admin \
            --admin_email=ci@example.com --skip-email --allow-root
          wp rewrite structure '/%postname%/' --path="$WP_DIR" --allow-root
          wp plugin install woocommerce --activate --path="$WP_DIR" --allow-root
          wp option update woocommerce_coming_soon no --path="$WP_DIR" --allow-root
          wp eval 'WC_Install::create_pages();' --path="$WP_DIR" --allow-root
      - name: Install and activate the plugin and theme
        run: |
          if [ "$KIND" = plugin ]; then plugin_src=self; theme_src=paired; else plugin_src=paired; theme_src=self; fi
          with_plugin=0
          if [ -f "$plugin_src/$PLUGIN_SLUG.php" ]; then
            ln -s "$GITHUB_WORKSPACE/$plugin_src" "$WP_DIR/wp-content/plugins/$PLUGIN_SLUG"
            wp plugin activate "$PLUGIN_SLUG" --path="$WP_DIR" --allow-root
            with_plugin=1
          fi
          if [ -f "$theme_src/style.css" ]; then
            ln -s "$GITHUB_WORKSPACE/$theme_src" "$WP_DIR/wp-content/themes/$THEME_SLUG"
            wp theme activate "$THEME_SLUG" --path="$WP_DIR" --allow-root
          fi
          wp rewrite flush --path="$WP_DIR" --allow-root
          echo "WITH_PLUGIN=$with_plugin" >> "$GITHUB_ENV"
      - name: Run smoke test
        run: |
          php -S 127.0.0.1:8080 -t "$WP_DIR" "$GITHUB_WORKSPACE/self/.github/scripts/router.php" > /tmp/php-server.log 2>&1 &
          sleep 2
          BASE_URL="$BASE_URL" DEBUG_LOG=/tmp/wp-debug.log WP="wp --path=$WP_DIR --allow-root" OUT_DIR=/tmp/smoke \
            bash self/.github/scripts/smoke-test.sh
      - name: Upload responses and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: |
            /tmp/smoke
            /tmp/wp-debug.log
            /tmp/php-server.log
          if-no-files-found: ignore
